<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Copart - Administrador</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #f0f2f5; color: #333; padding: 20px; }
  .login-box { background: #fff; max-width: 400px; margin: 80px auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
  .login-box h2 { text-align: center; color: #003366; margin-bottom: 20px; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 13px; font-weight: 700; color: #555; margin-bottom: 5px; }
  .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  .btn { padding: 12px; background: #ff8c00; color: #fff; border: none; border-radius: 4px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%;}
  .btn:hover { background: #e67e00; }
  #painel { display: none; max-width: 1400px; margin: 0 auto; }
  .header-painel { background: #003366; color: #fff; padding: 15px 20px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; }
  .header-painel h1 { font-size: 20px; }
  .btn-sair { background: #dc3545; color: #fff; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; }
  .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
  .card-dash { background: #fff; padding: 20px; border-radius: 8px; border-left: 4px solid #003366; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .card-dash h3 { font-size: 12px; color: #666; text-transform: uppercase; margin-bottom: 5px; }
  .card-dash p { font-size: 24px; font-weight: 900; color: #003366; }
  .abas { display: flex; background: #fff; border-bottom: 2px solid #e0e4eb; overflow-x: auto; }
  .aba-btn { padding: 15px 30px; background: transparent; border: none; font-size: 16px; font-weight: 700; color: #666; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap;}
  .aba-btn.ativa { color: #003366; border-bottom-color: #ff8c00; }
  .conteudo-aba { display: none; background: #fff; padding: 20px; border-radius: 0 0 8px 8px; }
  .conteudo-aba.ativa { display: block; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .item-carro { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding: 15px 0; }
  .item-carro img { width: 80px; height: 60px; object-fit: cover; border-radius: 4px; background: #ddd; }
  .item-carro .info { flex: 1; margin-left: 15px; }
  .item-carro .info b { display: block; font-size: 16px; color: #003366; }
  .item-carro .info span { font-size: 13px; color: #666; display: block; margin-top: 4px; }
  .btn-whats { background: #25d366; color: #fff; padding: 8px 15px; border-radius: 4px; text-decoration: none; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
  .btn-editar { background: #0066cc; color: #fff; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; margin-right: 5px; }
  .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; color: #fff; }
  .bg-verde { background: #28a745; } .bg-vermelho { background: #dc3545; } .bg-amarelo { background: #ffc107; color: #333; }

  @media (max-width: 768px) {
    .dashboard { grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; gap: 10px; }
    .abas { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .aba-btn { padding: 12px 15px; font-size: 14px; }
    .header-painel h1 { font-size: 16px; }
    .header-painel { padding: 10px; }
    .card-dash p { font-size: 20px; }
    .btn { font-size: 16px; padding: 15px; }
    .item-carro { flex-direction: column; align-items: flex-start; gap: 10px; }
    .item-carro img { width: 100%; height: auto; max-height: 200px; }
  }
</style>
</head>
<body>
<div class="login-box" id="loginBox">
  <h2>Painel Admin</h2>
  <div class="form-group"><label>Usuário</label><input type="text" id="user" placeholder="admin"></div>
  <div class="form-group"><label>Senha</label><input type="password" id="pass" placeholder="admin123"></div>
  <button class="btn" onclick="fazerLogin()">Entrar</button>
</div>

<div id="painel">
  <div class="header-painel"><h1>🚗 Gerenciador de Leilão</h1><button class="btn-sair" onclick="sair()">Sair</button></div>
  
  <div class="dashboard">
    <div class="card-dash"><h3>Veículos</h3><p id="dashTotal">0</p></div>
    <div class="card-dash" style="border-left-color: #28a745;"><h3>Disponíveis</h3><p id="dashDisponiveis">0</p></div>
    <div class="card-dash" style="border-left-color: #ff8c00;"><h3>Lances</h3><p id="dashLances">0</p></div>
    <div class="card-dash" style="border-left-color: #17a2b8;"><h3>Vendas</h3><p id="dashVendas">0</p></div>
  </div>
  
  <div class="abas">
    <button class="aba-btn ativa" onclick="mudarAba('cadastro', event)">📝 Cadastrar Veículo</button>
    <button class="aba-btn" onclick="mudarAba('lances', event)">🔔 Arrematações e Lances</button>
    <button class="aba-btn" onclick="mudarAba('vendas', event)">💰 Vender Meu Carro</button>
    <button class="aba-btn" onclick="mudarAba('config', event)">⚙️ Configurações</button>
    <button class="aba-btn" onclick="mudarAba('agenda', event)">📅 Agenda de Leilões</button>
  </div>
  
  <div class="conteudo-aba ativa" id="aba-cadastro">
    <form id="formCarro" onsubmit="salvarCarro(event)">
      
      <input type="hidden" id="carroId">
      
      <div class="grid-3">
        <div class="form-group"><label>Nº do Lote *</label><input type="text" id="lote" required></div>
        <div class="form-group"><label>Marca *</label><input type="text" id="marca" required></div>
        <div class="form-group"><label>Modelo *</label><input type="text" id="modelo" required></div>
      </div>
      
      <div class="grid-3">
        <div class="form-group"><label>Versão</label><input type="text" id="versao"></div>
        <div class="form-group"><label>Ano Fabricação *</label><input type="number" id="ano_fab" required></div>
        <div class="form-group"><label>Ano Modelo *</label><input type="number" id="ano_mod" required></div>
      </div>

      <div class="grid-3">
        <div class="form-group"><label>Chassi</label><input type="text" id="chassi"></div>
        <div class="form-group"><label>Placa</label><input type="text" id="placa"></div>
        <div class="form-group"><label>Combustível</label><input type="text" id="combustivel"></div>
      </div>

      <div class="grid-3">
        <div class="form-group"><label>KM</label><input type="number" id="km"></div>
        <div class="form-group"><label>Cor</label><input type="text" id="cor"></div>
        <div class="form-group"><label>Categoria</label><select id="categoria"><option>Automóveis</option><option>Picapes</option><option>SUV</option><option>Motocicletas</option></select></div>
      </div>

      <div class="grid-2">
        <div class="form-group"><label>Status</label><select id="status"><option>Disponível</option><option>Venda Futura</option><option>Arrematado</option></select></div>
        <div class="form-group"><label>Condição</label><select id="condicao"><option>Colisão</option><option>Queimado</option><option>Alagado</option><option>Roubo/Furto</option><option>Normal</option></select></div>
      </div>
      
      <div class="grid-2">
        <div class="form-group"><label>Lance Atual (R$)</label><input type="number" step="0.01" id="lance" required></div>
        <div class="form-group"><label>Valor FIPE (R$)</label><input type="number" step="0.01" id="fipe" required></div>
      </div>
      
      <div class="form-group"><label>Pátio</label><input type="text" id="patio" placeholder="Ex: Curitiba - PR"></div>
      <div class="form-group"><label>Foto</label><input type="file" id="foto" accept="image/*"></div>
      <div class="form-group" style="display:flex; align-items:center; gap:10px; margin-top:15px;"><input type="checkbox" id="destaque" style="width: auto;"><label style="margin:0;">Destaque na Home</label></div>
      
      <button type="submit" class="btn" style="margin-top: 20px;">Salvar Veículo</button>
      <button type="button" class="btn" style="background:#666; margin-top: 10px; display:none;" id="btnCancelar" onclick="limparForm()">Cancelar Edição</button>
    </form>
  </div>

  <div class="conteudo-aba" id="aba-lances">
    <h2 style="color:#003366; margin-bottom:15px;">Quem deu o último lance</h2>
    <div id="listaLances"></div>
  </div>

  <div class="conteudo-aba" id="aba-vendas">
    <h2 style="color:#003366; margin-bottom:15px;">Clientes querendo vender o carro</h2>
    <div id="listaVendas"></div>
  </div>

  <div class="conteudo-aba" id="aba-agenda">
    <h2 style="color:#003366; margin-bottom:15px;">Cadastrar Leilão na Agenda</h2>
    <form onsubmit="salvarLeilao(event)" style="background:#f8f9fa; padding:20px; border-radius:8px; margin-bottom:20px;">
      <div class="grid-3">
        <div class="form-group"><label>Data *</label><input type="date" id="agData" required></div>
        <div class="form-group"><label>Hora *</label><input type="time" id="agHora" required></div>
        <div class="form-group"><label>Local / Pátio *</label><input type="text" id="agLocal" placeholder="Ex: Curitiba - PR" required></div>
      </div>
      <button type="submit" class="btn">Adicionar Leilão</button>
    </form>
    <h3 style="color:#003366; margin-bottom:15px;">Leilões Agendados</h3>
    <div id="listaAgenda"></div>
  </div>

  <div class="conteudo-aba" id="aba-config">
    <h2 style="color:#003366; margin-bottom:15px;">Configurações do Site</h2>
    <div class="form-group"><label>E-mail de Suporte</label><input type="email" id="cfgEmail"></div>
    <div class="form-group"><label>Telefone de Suporte</label><input type="text" id="cfgTelefone"></div>
    <div class="form-group"><label>Horário de Atendimento</label><input type="text" id="cfgHorario"></div>
    <button class="btn" onclick="salvarConfig()" style="margin-top:15px;">Salvar Configurações</button>
  </div>

  <div class="conteudo-aba ativa" id="aba-lista-carros" style="border-top: 2px solid #eee; border-radius: 0; padding-top: 20px;">
    <h3 style="color:#003366; margin-bottom: 15px;">Veículos Cadastrados</h3>
    <input type="text" id="busca" placeholder="🔍 Buscar Lote, Marca ou Modelo..." oninput="carregarCarros()" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #003366; border-radius: 4px;">
    <div id="listaCarros"></div>
  </div>
</div>

<script>
  let token = localStorage.getItem('admin_token') || '';
  let veiculosGlobais = [];

  async function fazerLogin() {
    const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('user').value, senha: document.getElementById('pass').value }) });
    const data = await res.json();
    if (res.ok) { token = data.token; localStorage.setItem('admin_token', token); mostrarPainel(); } else { alert(data.erro); }
  }
  
  function sair() { localStorage.removeItem('admin_token'); location.reload(); }
  
  function mostrarPainel() { 
    document.getElementById('loginBox').style.display = 'none'; 
    document.getElementById('painel').style.display = 'block'; 
    carregarCarros(); 
    carregarConfig(); 
  }

  function mudarAba(aba, event) {
    document.querySelectorAll('.aba-btn').forEach(b => b.classList.remove('ativa'));
    document.querySelectorAll('.conteudo-aba').forEach(c => c.classList.remove('ativa'));
    event.target.classList.add('ativa');
    if(aba === 'cadastro') { document.getElementById('aba-cadastro').classList.add('ativa'); document.getElementById('aba-lista-carros').classList.add('ativa'); }
    if(aba === 'lances') { document.getElementById('aba-lances').classList.add('ativa'); renderizarLances(); }
    if(aba === 'vendas') { document.getElementById('aba-vendas').classList.add('ativa'); renderizarVendas(); }
    if(aba === 'config') { document.getElementById('aba-config').classList.add('ativa'); carregarConfig(); }
    if(aba === 'agenda') { document.getElementById('aba-agenda').classList.add('ativa'); carregarAgenda(); }
  }

  async function carregarCarros() {
    const res = await fetch('/api/veiculos');
    veiculosGlobais = await res.json();
    document.getElementById('dashTotal').innerText = veiculosGlobais.length;
    document.getElementById('dashDisponiveis').innerText = veiculosGlobais.filter(c => c.status === 'Disponível').length;
    const busca = document.getElementById('busca').value.toLowerCase();
    let listaFiltrada = busca ? veiculosGlobais.filter(c => (c.lote || '').toLowerCase().includes(busca) || (c.marca || '').toLowerCase().includes(busca) || (c.modelo || '').toLowerCase().includes(busca)) : veiculosGlobais;
    document.getElementById('listaCarros').innerHTML = listaFiltrada.map(c => {
      let cor = c.status === 'Disponível' ? 'bg-verde' : (c.status === 'Arrematado' ? 'bg-vermelho' : 'bg-amarelo');
      return `<div class="item-carro"><img src="${c.foto_url || 'https://via.placeholder.com/80x60?text=Sem+Foto'}"><div class="info"><b>Lote ${c.lote} - ${c.marca} ${c.modelo} (${c.ano_fab})</b><span>Lance: R$ ${c.lance_atual ? c.lance_atual.toLocaleString('pt-BR') : '0'}</span><span><span class="badge ${cor}">${c.status}</span></span></div><button class="btn-editar" onclick='editarCarro(${JSON.stringify(c)})'>Editar</button></div>`;
    }).join('');
  }

  async function carregarAgenda() {
    const res = await fetch('/api/leiloes');
    const leiloes = await res.json();
    document.getElementById('listaAgenda').innerHTML = leiloes.map(l => `
      <div class="item-carro">
        <div class="info"><b>${l.data} às ${l.hora}</b><span>Local: ${l.local}</span></div>
      </div>
    `).join('');
  }

  async function salvarLeilao(e) {
    e.preventDefault();
    const dados = {
      data: document.getElementById('agData').value,
      hora: document.getElementById('agHora').value,
      local: document.getElementById('agLocal').value
    };
    const res = await fetch('/api/admin/leiloes', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(dados) });
    if(res.ok) { alert('Leilão agendado!'); e.target.reset(); carregarAgenda(); }
  }

  async function carregarConfig() {
    const res = await fetch('/api/configuracoes');
    const data = await res.json();
    document.getElementById('cfgEmail').value = data.suporte_email || '';
    document.getElementById('cfgTelefone').value = data.suporte_telefone || '';
    document.getElementById('cfgHorario').value = data.suporte_horario || '';
  }

  async function salvarConfig() {
    const dados = { suporte_email: document.getElementById('cfgEmail').value, suporte_telefone: document.getElementById('cfgTelefone').value, suporte_horario: document.getElementById('cfgHorario').value };
    const res = await fetch('/api/admin/configuracoes', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(dados) });
    if(res.ok) alert('Configurações salvas!');
  }

  async function renderizarLances() {
    const res = await fetch('/api/admin/lances', { headers: { 'Authorization': 'Bearer ' + token } });
    const lances = await res.json();
    document.getElementById('dashLances').innerText = lances.length || 0;
    if(lances.length === 0) { document.getElementById('listaLances').innerHTML = '<p>Nenhum lance recebido ainda.</p>'; return; }
    document.getElementById('listaLances').innerHTML = lances.map(l => `<div class="item-carro"><div class="info"><b>Lote ${l.lote} - ${l.marca} ${l.modelo}</b><span>Lance: R$ ${l.valor_lance.toLocaleString('pt-BR')}</span><span style="color: #003366; font-weight:bold;">👤 ${l.nome_cliente} | CPF: ${l.cpf_cliente}</span></div><a href="https://wa.me/55${l.telefone_cliente.replace(/\D/g,'')}" target="_blank" class="btn-whats">💬 Chamar no WhatsApp</a></div>`).join('');
  }

  async function renderizarVendas() {
    const res = await fetch('/api/admin/vendas', { headers: { 'Authorization': 'Bearer ' + token } });
    const vendas = await res.json();
    document.getElementById('dashVendas').innerText = vendas.length || 0;
    if(vendas.length === 0) { document.getElementById('listaVendas').innerHTML = '<p>Nenhum cliente solicitou venda ainda.</p>'; return; }
    document.getElementById('listaVendas').innerHTML = vendas.map(v => `<div class="item-carro"><div class="info"><b>${v.marca} ${v.modelo} (${v.ano})</b><span>Condição: ${v.condicao} | Pretensão: R$ ${v.valor_pretendido}</span><span style="color: #003366; font-weight:bold;">👤 ${v.nome_cliente} | Tel: ${v.telefone_cliente}</span></div><a href="https://wa.me/55${v.telefone_cliente.replace(/\D/g,'')}" target="_blank" class="btn-whats">💬 Chamar no WhatsApp</a></div>`).join('');
  }

  async function salvarCarro(e) {
    e.preventDefault();
    const id = document.getElementById('carroId').value;
    const formData = new FormData();
    formData.append('lote', document.getElementById('lote').value); formData.append('marca', document.getElementById('marca').value); formData.append('modelo', document.getElementById('modelo').value);
    formData.append('versao', document.getElementById('versao').value); formData.append('ano_fab', document.getElementById('ano_fab').value); formData.append('ano_mod', document.getElementById('ano_mod').value);
    formData.append('chassi', document.getElementById('chassi').value); formData.append('placa', document.getElementById('placa').value); formData.append('combustivel', document.getElementById('combustivel').value);
    formData.append('km', document.getElementById('km').value); formData.append('cor', document.getElementById('cor').value); formData.append('categoria', document.getElementById('categoria').value);
    formData.append('status', document.getElementById('status').value); formData.append('condicao', document.getElementById('condicao').value); formData.append('lance_atual', document.getElementById('lance').value);
    formData.append('valor_fipe', document.getElementById('fipe').value); formData.append('patio', document.getElementById('patio').value); formData.append('destaque', document.getElementById('destaque').checked);
    const fotoFile = document.getElementById('foto').files[0]; if (fotoFile) formData.append('foto', fotoFile);

    const res = await fetch(id ? '/api/admin/veiculos/'+id : '/api/admin/veiculos', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: formData });
    if (res.ok) { alert('Salvo!'); limparForm(); carregarCarros(); } else { alert('Erro ao salvar'); }
  }

  function editarCarro(carro) {
    document.getElementById('carroId').value = carro.id; document.getElementById('lote').value = carro.lote; document.getElementById('marca').value = carro.marca;
    document.getElementById('modelo').value = carro.modelo; document.getElementById('versao').value = carro.versao || ''; document.getElementById('ano_fab').value = carro.ano_fab || '';
    document.getElementById('ano_mod').value = carro.ano_mod || ''; document.getElementById('chassi').value = carro.chassi; document.getElementById('placa').value = carro.placa;
    document.getElementById('combustivel').value = carro.combustivel || ''; document.getElementById('km').value = carro.km; document.getElementById('cor').value = carro.cor;
    document.getElementById('categoria').value = carro.categoria; document.getElementById('status').value = carro.status; document.getElementById('condicao').value = carro.condicao;
    document.getElementById('lance').value = carro.lance_atual; document.getElementById('fipe').value = carro.valor_fipe; document.getElementById('patio').value = carro.patio;
    document.getElementById('destaque').checked = carro.destaque === 1; document.getElementById('btnCancelar').style.display = 'block'; window.scrollTo(0, 0);
  }

  function limparForm() { 
    document.getElementById('formCarro').reset(); 
    document.getElementById('carroId').value = ''; 
    document.getElementById('btnCancelar').style.display = 'none'; 
  }

  if (token) mostrarPainel();
</script>
</body>
</html>
